<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first for anything modern; the 32px PNG is the fallback for the
         handful of clients that ignore it. apple-touch-icon must stay an opaque
         PNG — iOS renders transparency black and applies its own corner mask. -->
    <link rel="icon" type="image/svg+xml" href="/stubbase-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color" name="theme-color" content="#09090B" />
    <title>Stubbase Dashboard</title>
    <!--
      Resolves the theme before the bundle loads, so the shell never paints in
      the wrong one. The class is always stamped explicitly — the shadcn ui/
      primitives key off `dark:`, which needs `.dark` actually present rather
      than merely implied.

      Precedence: the `stubbase_theme` cookie, then localStorage, then the OS.
      The cookie comes first because it is the copy the landing site can also
      write (it is a different origin and cannot see this one's localStorage),
      so it carries a choice made over on stubbase.dev. The resolved value is
      written back to both stores, so the two converge after one page view.

      Keep in sync with src/lib/cross-site.ts (cookie name, domain rule) and
      src/stores/theme.ts, which owns the theme from here on. Neither can be
      imported: this has to run before any bundle exists, or the page flashes.
    -->
    <script>
      (function () {
        var host = location.hostname
        var parts = host.split('.')
        var domain =
          host === 'localhost' || /^[\d.]+$/.test(host) || parts.length < 2
            ? ''
            : '; domain=' + parts.slice(-2).join('.')

        var cookie = document.cookie.match(/(?:^|; )stubbase_theme=([^;]*)/)
        var stored = cookie ? cookie[1] : null
        if (stored !== 'light' && stored !== 'dark') {
          try {
            stored = localStorage.getItem('stubbase-theme')
          } catch (err) {
            /* Private mode or blocked storage — fall through to the OS preference. */
          }
        }

        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'

        document.documentElement.classList.add(theme)
        var meta = document.getElementById('theme-color')
        if (meta) meta.setAttribute('content', theme === 'light' ? '#FAFAFA' : '#09090B')

        // Converge the two stores, so whichever side was stale stops being so.
        document.cookie =
          'stubbase_theme=' +
          theme +
          '; path=/; max-age=31536000; samesite=lax' +
          domain +
          (location.protocol === 'https:' ? '; secure' : '')
        try {
          localStorage.setItem('stubbase-theme', theme)
        } catch (err) {
          /* Nothing to do — the cookie still carries the choice. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
