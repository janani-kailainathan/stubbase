<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stubbase — briefly unavailable</title>
<meta http-equiv="refresh" content="3">
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #09090b;
    color: #e4e4e7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 26rem;
    margin: 1.5rem;
    padding: 2rem;
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 0.75rem;
    text-align: center;
  }
  .status {
    display: inline-flex;
    align-items: center;
    margin-bottom: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #34d399;
  }
  .dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 9999px;
    background: #34d399;
    display: inline-block;
    margin-right: 0.5rem;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
    color: #fafafa;
  }
  p {
    margin: 0;
    font-size: 0.875rem;
    line-height: 1.5;
    color: #a1a1aa;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="status"><span class="dot"></span>Deploying</div>
    <h1>Stubbase is briefly unavailable</h1>
    <p>We're rolling out an update. This page refreshes automatically — usually back within a few seconds.</p>
  </div>
</body>
</html>
