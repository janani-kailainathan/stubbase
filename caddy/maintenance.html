<!--
  Stubbase's 502 page. Caddy serves it from /var/www/stubbase-error when the
  core or the Dashboard API is not answering — a deploy restarting them, or a
  crash — keeping the 502 status and adding Retry-After: 10.

  It is served on the API hosts, not stubbase.dev, so it can rely on nothing
  the landing site ships: everything is inline. It follows the landing site's
  look — its tokens (src/styles/global.css), dark by default with light under
  prefers-color-scheme, Inter, JetBrains Mono and Home's handwritten accent —
  but has no header or footer, and no script: the refresh is a meta tag and
  the countdown is CSS.

  The three fonts are embedded as subsets to keep the page small: Inter and
  JetBrains Mono hold printable ASCII plus · — ’ …, and Sedgwick Ave holds
  lowercase a–z only. A character outside those falls back to the system font,
  so check the page after changing its copy. Made with fonttools' pyftsubset
  from the landing site's Fontsource files.
-->

  /* The landing site's tokens, dark first as there (src/styles/global.css). */
  :root {
    --background: oklch(14.1% 0.005 285.823);   /* zinc-950 */
    --foreground: oklch(98.5% 0 0);             /* zinc-50 */
    --card: oklch(21% 0.006 285.885);           /* zinc-900 */
    --muted: oklch(27.4% 0.006 286.033);        /* zinc-800 */
    --muted-hover: color-mix(in oklab, oklch(27.4% 0.006 286.033) 50%, transparent);
    --border-c: oklch(27.4% 0.006 286.033);     /* zinc-800 */
    --border-strong: oklch(37% 0.013 285.805);  /* zinc-700 */
    --muted-foreground: oklch(70.5% 0.015 286.067); /* zinc-400 */
    --subtle: oklch(55.2% 0.016 285.938);       /* zinc-500 */
    --primary: oklch(69.6% 0.17 162.48);        /* emerald-500 */
    --primary-hover: oklch(59.6% 0.145 163.225);/* emerald-600 */
    --primary-foreground: #000;
    --primary-ink: oklch(76.5% 0.177 163.223);  /* emerald-400 */
    --primary-soft: color-mix(in oklab, oklch(69.6% 0.17 162.48) 10%, transparent);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --background: #fff;
      --foreground: oklch(21% 0.006 285.885);   /* zinc-900 */
      --card: oklch(98.5% 0 0);                 /* zinc-50 */
      --muted: oklch(96.7% 0.001 286.375);      /* zinc-100 */
      --muted-hover: oklch(96.7% 0.001 286.375);
      --border-c: oklch(92% 0.004 286.32);      /* zinc-200 */
      --border-strong: oklch(87.1% 0.006 286.286); /* zinc-300 */
      --muted-foreground: oklch(44.2% 0.017 285.786); /* zinc-600 */
      --subtle: oklch(55.2% 0.016 285.938);     /* zinc-500 */
      --primary-foreground: #fff;
      --primary-ink: oklch(59.6% 0.145 163.225);/* emerald-600 */
    }
  }

  * { box-sizing: border-box; }
  html { background: var(--background); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
    position: relative;
    overflow-x: hidden;
    background: var(--background);
    color: var(--foreground);
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; }

  /* Home's hero canvas: a dot grid fading out towards the edges. */
  .dots {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(var(--border-strong) 1px, transparent 1px);
    background-size: 20px 20px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 30%, transparent 75%);
    opacity: 0.6;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 36rem;
    text-align: center;
  }

  .wordmark { display: inline-block; height: 24px; width: auto; color: var(--foreground); }

  h1 {
    margin: 40px 0 0;
    font-size: clamp(2.25rem, 7vw, 3.75rem);
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }
  /* The one handwritten word, on a tinted card like a sticky note. */
  .accent {
    display: inline-block;
    padding: 0 0.12em;
    font-family: 'Sedgwick Ave', cursive;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--primary-ink);
    background: var(--primary-soft);
    rotate: -2deg;
  }

  .lede {
    margin: 24px auto 0;
    max-width: 30rem;
    font-size: 1.125rem;
    line-height: 1.65;
    color: var(--muted-foreground);
    text-wrap: pretty;
  }

  .actions {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  /* Home's two-layer buttons: a faint ring around the button itself. */
  .btn {
    display: inline-block;
    padding: 4px;
    border-radius: 16px;
    background: var(--muted-hover);
    text-decoration: none;
  }
  .btn span {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    transition: background-color 150ms ease;
  }
  .btn-primary span { background: var(--primary); color: var(--primary-foreground); }
  .btn-primary:hover span { background: var(--primary-hover); }
  .btn-secondary span { border: 1px solid var(--border-c); background: var(--card); color: var(--foreground); }
  .btn-secondary:hover span { background: var(--muted); }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn svg { width: 16px; height: 16px; }

  /* The countdown, in CSS: an integer property animated 10 → 0, shown
     through a counter, and a bar draining over the same 10 seconds. */
  @property --sec {
    syntax: '<integer>';
    initial-value: 10;
    inherits: false;
  }
  .retry {
    margin: 20px auto 0;
    max-width: 14rem;
    font-size: 12px;
    color: var(--subtle);
  }
  .count {
    counter-reset: sec var(--sec);
    animation: count 10s steps(10, end) forwards;
  }
  .count::after { content: counter(sec); }
  @keyframes count { from { --sec: 10; } to { --sec: 0; } }
  .bar {
    margin-top: 8px;
    height: 2px;
    border-radius: 9999px;
    background: var(--border-c);
    overflow: hidden;
  }
  .bar::before {
    content: '';
    display: block;
    height: 100%;
    background: var(--primary);
    transform-origin: left;
    animation: drain 10s linear forwards;
  }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* Home's entrance: the text rises out of a blur. */
  .rise { animation: rise 700ms cubic-bezier(0.2, 0.7, 0.2, 1) var(--d, 0s) both; }
  @keyframes rise { from { opacity: 0; filter: blur(8px); translate: 0 12px; } }

  @media (prefers-reduced-motion: reduce) {
    .rise, .bar::before { animation: none; }
  }
</style>
